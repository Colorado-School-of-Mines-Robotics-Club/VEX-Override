[package]
name = "display"
version = "0.1.0"
edition = "2024"

[dependencies]
buoyant = { git = "https://github.com/riley-williams/buoyant", tag = "0.7.0", features = ["rusttype-fonts"] }
embedded-graphics = "0.8.2"
rusttype = "0.9.3"
strum = { version = "0.28.0", features = ["derive"] }
zune-jpeg = "0.5.15"
zune-image = { version = "0.5.0", default-features = false }
shrewnit.workspace = true
autons.workspace = true
