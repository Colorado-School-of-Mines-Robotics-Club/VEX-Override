[workspace]
resolver = "3"
members = ["coprocessor", "display", "display/simulator", "display/testing"]

[workspace.dependencies]
vexide = { version = "0.9.0-alpha.1", features = ["full", "default-sdk"] }
futures-lite = "2.6.1"
# autons = "0.2.0"
autons = { git = "https://github.com/TymanWasTaken/autons" }
shrewnit = { git = "https://github.com/Colorado-School-of-Mines-Robotics-Club/shrewnit" }
# Display
buoyant = "0.7.0"
embedded-graphics = "0.8.2"
embedded-graphics-simulator = "0.8.0"
vexide-embedded-graphics = { git = "https://github.com/TymanWasTaken/vexide-embedded-graphics" }
