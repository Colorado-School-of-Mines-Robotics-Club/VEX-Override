[workspace]
resolver = "3"
members = ["coprocessor", "display", "display/simulator", "display/testing"]

[workspace.dependencies]
vexide = { version = "0.8.0", features = ["full", "default-sdk"] }
futures-lite = "2.6.1"
autons = "0.2.0"
shrewnit = { git = "https://github.com/Colorado-School-of-Mines-Robotics-Club/shrewnit" }
# Display
buoyant = { git = "https://github.com/riley-williams/buoyant", tag = "0.7.0" }
embedded-graphics = "0.8.2"
embedded-graphics-simulator = "0.8.0"
vexide-embedded-graphics = { git = "https://github.com/vexide/vexide-embedded-graphics", rev = "a19c3577a4cffe0d161b6c346cc846e7f17422d0" }

[patch.crates-io]
vex-sdk-jumptable = { git = "https://github.com/vexide/vex-sdk" }
vex-sdk-mock = { git = "https://github.com/vexide/vex-sdk" }
