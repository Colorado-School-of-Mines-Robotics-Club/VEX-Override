[package]
name = "swerve"
version = "0.1.0"
edition = "2024"

[profile.release]
opt-level = "z"
lto = "fat"

# These fields configure default behavior for uploads with `cargo v5`.
[package.metadata.v5]
upload-strategy = "differential"
slot = 2
icon = "cool-x"
compress = true

[dependencies]
evian = { path = "../../../evian/packages/evian" }
vexide.workspace = true
shrewnit.workspace = true

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html
