[package]
name = "pico-override"
version = "0.1.0"
edition = "2024"

[dependencies]
bitter = { version = "0.9.0", default-features = false }
bytemuck = { version = "1.25.0", default-features = false, features = ["derive", "min_const_generics", "must_cast"] }
cobs = { version = "0.5.1", default-features = false, features = ["defmt"] }
cortex-m-rt = "0.7.5"
crc = "3.4.0"
defmt = "1.0.1"
defmt-embassy-usbserial = { version = "0.2.1", optional = true, features = ["buffersize-64"], default-features = false }
defmt-rtt = { version = "1.1.0", optional = true }
embassy-executor = { version = "0.10.0", features = ["platform-cortex-m", "executor-thread", "defmt"] }
embassy-futures = { version = "0.1.2", features = ["defmt"] }
embassy-rp = { version = "0.10.0", features = ["rp235xa", "rt", "defmt", "critical-section-impl", "rom-func-cache", "intrinsics", "rom-v2-intrinsics", "boot2-w25q080", "binary-info", "time-driver"] }
embassy-sync = { version = "0.8.0", features = ["defmt"] }
embassy-time = { version = "0.5.1", features = ["defmt", "defmt-timestamp-uptime"] }
embassy-usb = { version = "0.5.0", features = ["defmt"], optional = true }
embedded-hal-async = { version = "1.0.0", features = ["defmt-03"] }
embedded-rpc = "0.2.0"
fixed = { version = "1.31.0", features = ["defmt"] }
nom = { version = "8.0.0", default-features = false }
panic-probe = { version = "1.0.0", features = ["print-defmt"] }
static_cell = "2.1.1"

[features]
default = ["usb"]
usb = ["dep:embassy-usb", "dep:defmt-embassy-usbserial"]
probe = ["dep:defmt-rtt"]
